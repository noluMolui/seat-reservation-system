<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Reservation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }

        .panel {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }

        /* Form elements */
        label {
            font-weight: bold;
            font-size: 0.85rem;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }

        /* Seat Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .seat {
            padding: 12px 5px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background-color: #ecf0f1;
            font-size: 0.9rem;
        }

        .seat small {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            margin-top: 3px;
        }

        .seat.available {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .seat.held {
            background-color: #fff3cd;
            border-color: #ffc107;
            color: #856404;
            cursor: not-allowed;
        }

        .seat.confirmed {
            background-color: #cce5ff;
            border-color: #004085;
            color: #004085;
            cursor: not-allowed;
        }

        /* Log window */
        .log-panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .log-box {
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            height: 120px;
            overflow-y: auto;
        }

        .log-item {
            margin-bottom: 4px;
        }

        #actionMessage {
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Seat Reservation System</h1>
 

    <div class="container">
        <!-- Left Side: Seat Map -->
        <div class="panel" style="flex: 1.2;">
            <h3>Event Seat Map</h3>
            <p style="font-size: 0.9rem; color: #666;">Click any green seat to place a temporary hold.</p>
            <div id="seatGrid" class="grid"></div>
        </div>

        <!-- Right Side: Controls -->
        <div class="panel" style="flex: 1;">
            <h3>User Session</h3>
            <label for="userEmail">Email Address</label>
            <input type="email" id="userEmail" placeholder="Enter your email address">

            <h3>Manage Hold</h3>
            <label for="holdCodeInput">Hold Code</label>
            <input type="text" id="holdCodeInput" placeholder="Enter 6-digit code">
            
            <button onclick="confirmHold()">Confirm Hold</button>
            <button onclick="releaseSeat()" class="btn-danger">Release Seat</button>
            <p id="actionMessage"></p>
        </div>
    </div>

    <!-- Bottom: Activity Log -->
    <div class="log-panel" style="margin-top: 20px;">
        <h3>System Activity Log</h3>
        <div id="logContainer" class="log-box">
            <div class="log-item">[System] Initialized successfully.</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function fetchSeats() {
            try {
                const res = await fetch(`${API_URL}/seats`);
                const data = await res.json();
                if (data.success) {
                    renderSeats(data.seats);
                }
            } catch (err) {
                console.error('Error fetching seats:', err);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch(`${API_URL}/logs`);
                const data = await res.json();
                if (data.success && data.logs) {
                    const logContainer = document.getElementById('logContainer');
                    logContainer.innerHTML = data.logs.slice(-4).reverse().map(log => `
                        <div class="log-item">> [${log.type}] Seat ${log.seatNumber || '-'} | ${log.email}</div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error fetching logs:', err);
            }
        }

        function renderSeats(seatsArray) {
            const grid = document.getElementById('seatGrid');
            grid.innerHTML = '';
            
            const seats = Array.isArray(seatsArray) ? seatsArray : seatsArray.seats;
            if (!seats) return;

            seats.forEach(seat => {
                const div = document.createElement('div');
                div.className = `seat ${seat.status}`;
                div.innerHTML = `Seat ${seat.seatNumber}<small>${seat.status}</small>`;
                if (seat.status === 'available') {
                    div.onclick = () => placeHold(seat.seatNumber);
                }
                grid.appendChild(div);
            });
        }

        async function placeHold(seatNumber) {
            const email = document.getElementById('userEmail').value.trim();
            if (!email) {
                alert('Please enter your email first!');
                return;
            }

            const res = await fetch(`${API_URL}/holds`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seatNumber, email })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('holdCodeInput').value = data.holdCode;
                setMessage(`Success! Code: ${data.holdCode}`, false);
                fetchSeats();
                fetchLogs();
            } else {
                setMessage(`Failed: ${data.reason}`, true);
            }
        }

        async function confirmHold() {
            const email = document.getElementById('userEmail').value.trim();
            const holdCode = document.getElementById('holdCodeInput').value.trim();
            if (!email) {
                setMessage('Please enter your email.', true);
                return;
            }
            if (!holdCode) {
                setMessage('Please enter a hold code.', true);
                return;
            }

            const res = await fetch(`${API_URL}/confirms`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ holdCode, email })
            });
            const data = await res.json();
            setMessage(data.success ? 'Seat confirmed successfully!' : `Error: ${data.reason}`, !data.success);
            fetchSeats();
            fetchLogs();
        }

        async function releaseSeat() {
            const email = document.getElementById('userEmail').value.trim();
            const holdCode = document.getElementById('holdCodeInput').value.trim();
            if (!email) {
                setMessage('Please enter your email.', true);
                return;
            }
            if (!holdCode) {
                setMessage('Please enter a hold code.', true);
                return;
            }

            const res = await fetch(`${API_URL}/releases`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ holdCode, email })
            });
            const data = await res.json();
            setMessage(data.success ? 'Seat released.' : `Error: ${data.reason}`, !data.success);
            fetchSeats();
            fetchLogs();
        }

        function setMessage(text, isError) {
            const msg = document.getElementById('actionMessage');
            msg.style.color = isError ? '#e74c3c' : '#27ae60';
            msg.innerText = text;
        }

        setInterval(() => {
            fetchSeats();
            fetchLogs();
        }, 3000);

        fetchSeats();
        fetchLogs();
    </script>
</body>
</html>
